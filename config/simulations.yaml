# """
# Configuration file for all simulation studies.
# """

# global simulation settings
settings:
  n_truth: 1000000
  n_claims: 200
  time_horizon: 4.0
  n_init_cuts: 10
  n_cuts: 10
  n_intervals: 10  # Can be modified to increase/decrease the number of discrete intervals
  outdir: "outputs"

# algorithm specifications
specs:
  n_warmup: 1000
  n_iter: 2000
  n_boot: 2000
  n_samples: 20000

